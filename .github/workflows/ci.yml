name: benchmark validation

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[analysis,dev]'
      - run: python -m pip check
      - run: python -m pytest -q
      - run: python scripts/validate_release.py
      - name: Build and install wheel in a separate environment
        run: |
          python -m build
          python -m venv "$RUNNER_TEMP/explo2-wheel"
          for wheel in dist/*.whl; do
            "$RUNNER_TEMP/explo2-wheel/bin/python" -m pip install "${wheel}[analysis]"
          done
          "$RUNNER_TEMP/explo2-wheel/bin/python" -m pip check
      - name: Check installed package and bundled benchmarks outside the checkout
        working-directory: ${{ runner.temp }}
        run: |
          unset PYTHONPATH EXPLO2_BENCH_DATA
          "$RUNNER_TEMP/explo2-wheel/bin/python" -I "$GITHUB_WORKSPACE/scripts/check_installation.py"

